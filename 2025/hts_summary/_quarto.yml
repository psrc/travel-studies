project:
  type: book

book:
  repo-url: https://github.com/psrc/travel-studies/tree/master/2025
  search: false
  sidebar:
    logo: PSRClogo2016path.png

profile:
  default: exploration-analysis


format:
  html:
    toc: true
    toc-depth: 4
    toc-expand: 4
    mainfont: Poppins
    theme: [cosmo, custom.scss]  # custom formatting
    code-tools: true
    df-print: kable
    fig-asp: .7
    fig-width: 4
    out-width: "40%"
    notebook-links: inline

execute:
  freeze: auto  # re-render only when source changes


echo: false
warnings: false
comments:  # enable commenting
  hypothesis: true
